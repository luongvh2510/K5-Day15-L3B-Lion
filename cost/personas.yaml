# D2: mô phỏng số người đặt hộ, không phải số học viên track A.
# Các tần suất là trung bình của từng nhóm Q2 trong khảo sát N=20 qua Q1.
# Một input benchmark được tính là một lượt/phiên; chưa đo đủ hội thoại thực tế.
sessions: 50
seed: 42

users:
  low: 50
  base: 200
  high: 500
  source: "(tự ước tính) số người đặt hộ hoạt động mỗi tháng; chưa có số người dùng thật, không ngoại suy N=20 thành quy mô thị trường."

personas:
  - name: dat_2_3_lan
    share: 0.35
    uses_per_month: 2.5714285714
    turns_per_session: 1
    source: "evidence/survey/results.csv Q1, Q2: 7/20 người đặt 2–3 lần/30 ngày, tổng 18/7; 1 lượt/phiên (tự ước tính)."
  - name: dat_4_5_lan
    share: 0.40
    uses_per_month: 4.5
    turns_per_session: 1
    source: "evidence/survey/results.csv Q1, Q2: 8/20 người đặt 4–5 lần/30 ngày, tổng 36/8; 1 lượt/phiên (tự ước tính)."
  - name: dat_6_8_lan
    share: 0.25
    uses_per_month: 6.8
    turns_per_session: 1
    source: "evidence/survey/results.csv Q1, Q2: 5/20 người đặt 6–8 lần/30 ngày, tổng 34/5; 1 lượt/phiên (tự ước tính)."

# USD / 1 triệu token, không tính cache. DeepSeek chọn giá niêm yết Fireworks
# qua OpenRouter; routing thực tế có thể chọn nhà cung cấp và giá khác.
# GPT-4.1 mini chỉ là kịch bản áp giá lên token DeepSeek, không đo chất lượng.
prices:
  - model: deepseek/deepseek-v4.1-flash
    input: 0.30
    output: 1.20
    source: "OpenRouter Fireworks standard: https://openrouter.ai/deepseek/deepseek-v4.1-flash · xem 28/11/2026"
  - model: openai/gpt-4.1-mini
    input: 0.40
    output: 1.60
    source: "OpenRouter: https://openrouter.ai/openai/gpt-4.1-mini · xem 28/11/2026"

